<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주파수 분해 기계: 원형 감기 시각화 (분리판)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="fourier-mach.js" defer></script>
    <style>
        /* 기존 CSS 스타일은 그대로 유지 */
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
        .container { max-width: 1200px; margin: 0 auto; }
        .controls { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .input-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .control-group { display: flex; flex-direction: column; min-width: 220px; flex: 1; }
        input[type="number"] { padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; }
        input[type="range"] { width: 100%; accent-color: #61dafb; }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .chart-container { background: #1e293b; padding: 20px; border-radius: 12px; }
        .full-width { grid-column: span 2; }
        canvas { width: 100% !important; height: 340px !important; }
        button { padding: 12px 30px; background: linear-gradient(135deg, #38bdf8, #0369a1); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .highlight-freq { color: #f43f5e; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fourier Winding Machine (푸리에 원형 파형 감기 기계)</h2>
    <p>주파수를 맞춰 파형을 원형 틀에 감았을 때, 2차원 무게중심이 원점에서 벗어나는 물리적 현상을 관찰합니다.</p>
    
    <div class="controls">
        <div class="input-row">
            <div class="control-group">
                <label for="freq1">합성 주파수 A (Hz)</label>
                <input type="number" id="freq1" value="2.0" min="0.5" max="5.0" step="0.5">
            </div>
            <div class="control-group">
                <label for="freq2">합성 주파수 B (Hz)</label>
                <input type="number" id="freq2" value="3.5" min="0.5" max="5.0" step="0.5">
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button id="startBtn">실시간 감기 시작</button>
            </div>
        </div>
        <div class="control-group">
            <label for="windingFreqInput">기계가 파형을 감는 진동수: <span id="windingFreqVal" class="highlight-freq">1.00</span> Hz</label>
            <input type="range" id="windingFreqInput" min="0.0" max="5.0" step="0.01" value="1.0">
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-container">
            <h3>1. 원래 시간-세기 그래프 (붉은선: 탐침 위치)</h3>
            <canvas id="timeChart"></canvas>
        </div>
        
        <div class="chart-container">
            <h3>2. 복소평면에 감긴 파형 (노란 점: 2차원 실제 무게중심)</h3>
            <canvas id="complexChart"></canvas>
        </div>
        
        <div class="chart-container full-width">
            <h3>3. 주파수 스펙트럼 분석 (X: 감는 진동수, Y: 무게중심의 절대적 변위 크기)</h3>
            <canvas id="centerTrackingChart"></canvas>
        </div>
    </div>
</div>

</body>
</html>
